version: '3.8'

x-common-env: &common-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_HOST: ${POSTGRES_HOST}

x-common-networks: &common-networks
  networks:
    - internal_network
    - external_network

x-common-volumes: &common-volumes
  volumes:
    - "..:/app"
    - gems_cache:/usr/local/bundle
    - node_modules_cache:/app/node_modules

x-common-build: &common-build
  build:
    context: ..
    dockerfile: .devcontainer/Dockerfile

x-common-depends-on: &common-depends-on
  depends_on:
    db:
      condition: service_healthy
    mailhog:
      condition: service_started

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 3

x-worker-template: &worker-template
  <<: [*common-build, *common-volumes, *common-depends-on, *common-networks]
  env_file:
    - .env

services:
  web:
    image: activeadmindemo/web:latest
    <<: [*common-build, *common-volumes, *common-depends-on, *common-networks]
    command: sleep infinity
    ports:
      - "4000:5000"
    env_file:
      - .env

  # High-priority worker
  worker_high:
    image: activeadmindemo/worker:latest
    <<: *worker-template
    command: >
      bundle exec que
      --worker-count ${WORKER_HIGH_COUNT:-2}
      --worker-priorities ${WORKER_HIGH_PRIORITIES:-0}
      --queue-name critical
      --queue-name urgent
      --log-level ${WORKER_LOG_LEVEL:-info}
      --poll-interval ${WORKER_POLL_INTERVAL:-5}

  # Mixed-priority worker
  worker_mixed:
    image: activeadmindemo/worker:latest
    <<: *worker-template
    command: >
      bundle exec que
      --worker-count ${WORKER_MIXED_COUNT:-2}
      --worker-priorities ${WORKER_MIXED_PRIORITIES:-5,10}
      --queue-name default
      --queue-name secondary
      --queue-name low_priority
      --log-level ${WORKER_LOG_LEVEL:-info}
      --poll-interval ${WORKER_POLL_INTERVAL:-5}
    
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    <<: *common-networks

  db:
    image: postgres:15
    environment:
      <<: *common-env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      <<: *healthcheck
    networks:
      - internal_network

  # dbeaver:
  #   image: dbeaver/cloudbeaver:latest
  #   ports:
  #     - "8080:8978"
  #   environment:
  #     CB_ADMIN_NAME: ${CB_ADMIN_NAME}
  #     CB_ADMIN_PASSWORD: ${CB_ADMIN_PASSWORD}
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   volumes:
  #     - dbeaver_data:/opt/cloudbeaver/workspace
  #   <<: *common-networks

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-password}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    <<: *common-networks

volumes:
  pg_data:
  pgadmin_data:
  gems_cache:
  node_modules_cache:

networks:
  external_network:
  internal_network:
    internal: true
